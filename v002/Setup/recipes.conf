# jac313 provision recipes — per-platform install commands for build prerequisites.
#
# Data-driven, like compilers.conf: to support a new OS, add a family line — no code
# change. bsir.sh runs these commands itself (one question, one sudo password).
# Readiness stays earned by sensing: after installing, bootstrap senses again, which
# refreshes FileCheckList.txt.
#
# Syntax: <component>.<field> = value   (# comments / blank lines ignored)
#   desc       human description, shown as the heading while bootstrap installs it
#   for        toolchain label this provides — include when that REQUIRED toolchain is
#              missing per sensing (FileCheckList readiness). Omit for standalone tools.
#   check      shell test; exit 0 = already satisfied. Include the recipe when it FAILS.
#   <family>   install command for that OS family (rhel | linuxmint | fedora | <ID>).
#
# Family tokens match FileCheckList's sensed os_family.

# --- compiler toolchains (tied to compilers.conf labels via `for`) ---

gcc15.desc      = GCC 15 toolchain
gcc15.for       = gcc15
gcc15.rhel      = sudo dnf install -y gcc-toolset-15
gcc15.fedora    = sudo dnf install -y gcc gcc-c++
gcc15.linuxmint = sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && sudo apt-get install -y g++-15

gcc16.desc      = GCC 16 toolchain (Fedora 44+ system gcc)
gcc16.for       = gcc16
gcc16.rhel      = sudo dnf install -y gcc-toolset-16
gcc16.fedora    = sudo dnf install -y gcc gcc-c++
gcc16.linuxmint = sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && sudo apt-get install -y g++-16

clang.desc      = Clang 20+ with module scan-deps (clang-scan-deps)
clang.for       = clang
clang.rhel      = sudo dnf install -y clang clang-tools-extra
clang.fedora    = sudo dnf install -y clang clang-tools-extra
clang.linuxmint = sudo apt-get install -y clang-20 clang-tools-20 && (command -v clang >/dev/null 2>&1 || sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 1000 >/dev/null 2>&1) && (command -v clang++ >/dev/null 2>&1 || sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 1000 >/dev/null 2>&1) || true

# --- standalone tools (gated by `check`) ---

# REQUIRED build dependency: Qlite links libsqlite3, so the dev headers must be present
# BEFORE the build. Checked in bootstrap's baseline (bsir.sh) so bootstrap installs
# it pre-build — without it `find_package(SQLite3)` fails on a fresh clone.
sqlite.desc      = SQLite3 dev libraries (Qlite links libsqlite3)
sqlite.check     = [ -e /usr/include/sqlite3.h ]
sqlite.rhel      = sudo dnf install -y sqlite-devel
sqlite.fedora    = sudo dnf install -y sqlite-devel
sqlite.linuxmint = sudo apt-get install -y libsqlite3-dev

# REQUIRED for the Postgres persist sink and the PG local / PG remote gates: libpq 18+
# client dev headers (PostgreSQL 18; the build needs libpq 18+). RHEL family:
# the PGDG repo's postgresql18-devel (installs under /usr/pgsql-18; its perl-IPC-Run
# dependency comes from CRB / CodeReady Builder, enabled here if missing). Fedora / Mint:
# the distro or PGDG libpq dev package, version 18+.
pg18.desc      = PostgreSQL 18 client dev libraries (libpq: Postgres persist sink + PG gates)
pg18.check     = [ -e /usr/pgsql-18/include/libpq-fe.h ] || { v=$(pkg-config --modversion libpq 2>/dev/null); v=${v%%[!0-9]*}; [ -n "$v" ] && [ "$v" -ge 18 ]; }
pg18.rhel      = (rpm -q pgdg-redhat-repo >/dev/null 2>&1 || sudo dnf install -y "https://download.postgresql.org/pub/repos/yum/reporpms/EL-$(rpm -E %rhel)-$(uname -m)/pgdg-redhat-repo-latest.noarch.rpm") && (rpm -q perl-IPC-Run >/dev/null 2>&1 || sudo dnf config-manager --set-enabled crb 2>/dev/null || sudo subscription-manager repos --enable "codeready-builder-for-rhel-$(rpm -E %rhel)-$(uname -m)-rpms") && sudo dnf install -y postgresql18-devel
pg18.fedora    = sudo dnf install -y libpq-devel
pg18.linuxmint = sudo apt-get install -y postgresql-common && sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y "$(. /etc/os-release; echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")" && sudo apt-get install -y libpq-dev

ninja.desc      = Ninja >= 1.11 (required for C++23 module builds)
ninja.check     = v=$(ninja --version 2>/dev/null); [ -n "$v" ] && [ "$(printf '1.11\n%s\n' "$v" | sort -V | head -n1)" = 1.11 ]
ninja.rhel      = sudo dnf install -y python3-pip && python3 -m pip install --user ninja
ninja.fedora    = sudo dnf install -y python3-pip && python3 -m pip install --user ninja
ninja.linuxmint = sudo apt-get install -y ninja-build

# Baseline is CMake >= 3.26 and module builds want >= 3.28: the distro packages below are
# enough.
cmake.desc      = CMake >= 3.26 (module builds: >= 3.28; the distro package is enough)
cmake.check     = command -v cmake >/dev/null 2>&1
cmake.rhel      = sudo dnf install -y cmake
cmake.fedora    = sudo dnf install -y cmake
cmake.linuxmint = sudo apt-get install -y cmake

# REQUIRED prerequisite. memcheck + helgrind + DRD all ship INSIDE the one valgrind package,
# so this single install covers the whole `matrix verify` / `verify-lite` gate. Readiness is
# NOT READY without it (valgrind.required = true -> part of the readiness gate, earned by check).
# The `check` requires BOTH the binary AND the dev header: the annotated verify tree
# (-DJAC313_STORE_HELGRIND_ANNOTATE=ON) #includes <valgrind/helgrind.h>, which on RHEL/Fedora
# ships in the SEPARATE valgrind-devel package (Debian bundles headers in `valgrind`).
valgrind.desc      = Valgrind + dev headers — memcheck + helgrind + DRD (the matrix verify gate)
valgrind.required  = true
valgrind.check     = command -v valgrind >/dev/null 2>&1 && [ -e /usr/include/valgrind/valgrind.h ] && [ -e /usr/include/valgrind/helgrind.h ] && [ -e /usr/include/valgrind/drd.h ]
valgrind.rhel      = sudo dnf install -y valgrind valgrind-devel
valgrind.fedora    = sudo dnf install -y valgrind valgrind-devel
valgrind.linuxmint = sudo apt-get install -y valgrind

# The U++ GUI build (Jac313Runner / JTextGui). On purpose there is no `check` and no `for`:
# only the bootstrap's GUI step uses it (skipped with --no-gui), after its own pkg-config check.
# It installs GTK3 (U++'s Wayland-first GUI goes through GTK), libnotify, FreeType,
# Fontconfig and the X11 libs that U++ CtrlCore links. U++ itself comes from upp_basefix
# into $HOME/upp_basefix (pinned GitHub commit + SHA-256-checked tree, no sudo).
upp_gui.desc      = U++ GUI build libraries (GTK3, libnotify, FreeType, Fontconfig, X11, zlib) for Jac313Runner and JTextGui; patch + rsync to build the patched U++ (not on Fedora Workstation by default)
upp_gui.rhel      = sudo dnf install -y 'pkgconfig(gtk+-3.0)' 'pkgconfig(libnotify)' 'pkgconfig(freetype2)' 'pkgconfig(fontconfig)' 'pkgconfig(x11)' 'pkgconfig(xinerama)' 'pkgconfig(xrender)' 'pkgconfig(xft)' 'pkgconfig(xcb)' 'pkgconfig(xext)' 'pkgconfig(expat)' bzip2-devel zlib-devel openssl-devel make patch rsync
upp_gui.fedora    = sudo dnf install -y 'pkgconfig(gtk+-3.0)' 'pkgconfig(libnotify)' 'pkgconfig(freetype2)' 'pkgconfig(fontconfig)' 'pkgconfig(x11)' 'pkgconfig(xinerama)' 'pkgconfig(xrender)' 'pkgconfig(xft)' 'pkgconfig(xcb)' 'pkgconfig(xext)' 'pkgconfig(expat)' bzip2-devel zlib-devel openssl-devel make patch rsync
upp_gui.linuxmint = sudo apt-get install -y libgtk-3-dev libnotify-dev libfreetype-dev libfontconfig-dev libx11-dev libxinerama-dev libxrender-dev libxft-dev libxcb1-dev libxext-dev libexpat1-dev libbz2-dev zlib1g-dev libssl-dev make pkg-config patch rsync

# The GUI step (skipped with --no-gui): DBeaver Community, a database browser for results.db (SQLite) and the
# PostgreSQL / MariaDB tables. DBeaver's own package from its GitHub release (Java included,
# ~130 MB), pinned to 26.2.3 with the sha256 GitHub publishes. The Flathub Flatpak was 2.1 GB.
dbeaver.desc      = DBeaver Community 26.2.3 (database browser; DBeaver's own RPM / DEB, sha256-checked)
dbeaver.check     = rpm -q dbeaver-ce >/dev/null 2>&1 || dpkg-query -W -f='${Status}' dbeaver-ce 2>/dev/null | grep -q 'install ok installed'
dbeaver.rhel      = v=26.2.3; case $(uname -m) in x86_64) a=x86_64 s=499f2b80a8fc5044e711116996a31c850236750ba32f99208c57526b3df61320 ;; aarch64) a=aarch64 s=12bad1814132d5c31df5dce67e798a7cc9a4c0f49304f2b8b2fbdb5102763a67 ;; *) echo "DBeaver: no package for $(uname -m)"; exit 1 ;; esac; f=dbeaver-ce-$v-linux-$a.rpm; d=$(mktemp -d) && curl -fL --progress-bar -o "$d/$f" "https://github.com/dbeaver/dbeaver/releases/download/$v/$f" && echo "$s  $d/$f" | sha256sum -c --quiet - && sudo dnf install -y "$d/$f"; rc=$?; rm -rf "$d"; exit $rc
dbeaver.fedora    = v=26.2.3; case $(uname -m) in x86_64) a=x86_64 s=499f2b80a8fc5044e711116996a31c850236750ba32f99208c57526b3df61320 ;; aarch64) a=aarch64 s=12bad1814132d5c31df5dce67e798a7cc9a4c0f49304f2b8b2fbdb5102763a67 ;; *) echo "DBeaver: no package for $(uname -m)"; exit 1 ;; esac; f=dbeaver-ce-$v-linux-$a.rpm; d=$(mktemp -d) && curl -fL --progress-bar -o "$d/$f" "https://github.com/dbeaver/dbeaver/releases/download/$v/$f" && echo "$s  $d/$f" | sha256sum -c --quiet - && sudo dnf install -y "$d/$f"; rc=$?; rm -rf "$d"; exit $rc
dbeaver.linuxmint = v=26.2.3; case $(uname -m) in x86_64) a=x86_64 s=66a9d989dc36bdaf71f95e4186efc022399c0dfcfb37e69034038502f2fb3d21 ;; aarch64) a=aarch64 s=79daaeee8b64ade4a06505bcc5ea17f22e11bde6a4a366ef208f1c3d3e06b6e2 ;; *) echo "DBeaver: no package for $(uname -m)"; exit 1 ;; esac; f=dbeaver-ce-$v-linux-$a.deb; d=$(mktemp -d) && curl -fL --progress-bar -o "$d/$f" "https://github.com/dbeaver/dbeaver/releases/download/$v/$f" && echo "$s  $d/$f" | sha256sum -c --quiet - && sudo apt-get install -y "$d/$f"; rc=$?; rm -rf "$d"; exit $rc
